<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap"
    rel="stylesheet" />
  <title>Photo Calendar Generator</title>
</head>

<body>
  <!-- Global app language switcher -->
  <div class="lang-switcher">
    <select id="lang-switcher-select" aria-label="Language">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
    </select>
  </div>

  <!-- Intro / welcome screen -->
  <section class="intro-section">
    <div class="intro-section__icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-plus-icon lucide-calendar-plus">
        <path d="M16 19h6" />
        <path d="M16 2v4" />
        <path d="M19 16v6" />
        <path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5" />
        <path d="M3 10h18" />
        <path d="M8 2v4" />
      </svg>
    </div>

    <h1 class="intro-section__title" data-i18n="intro.title">Design your own photo calendar</h1>
    <p class="intro-section__subtitle" data-i18n="intro.subtitle">
      Turn your favorite photos into a beautiful, printable calendar — right in your browser.
      Nothing is uploaded to a server, and no account is needed.
    </p>

    <ul class="intro-section__features">
      <li>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image-icon">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
          <circle cx="9" cy="9" r="2" />
          <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" />
        </svg>
        <span data-i18n="intro.feature1">Add a photo for every month</span>
      </li>
      <li>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-icon">
          <line x1="21" x2="14" y1="4" y2="4" />
          <line x1="10" x2="3" y1="4" y2="4" />
          <line x1="21" x2="12" y1="12" y2="12" />
          <line x1="8" x2="3" y1="12" y2="12" />
          <line x1="21" x2="16" y1="20" y2="20" />
          <line x1="12" x2="3" y1="20" y2="20" />
          <line x1="14" x2="14" y1="2" y2="6" />
          <line x1="8" x2="8" y1="10" y2="14" />
          <line x1="16" x2="16" y1="18" y2="22" />
        </svg>
        <span data-i18n="intro.feature2">Choose your layout & font</span>
      </li>
      <li>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download-icon">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
        <span data-i18n="intro.feature3">Export as PDF or JPG, ready to print</span>
      </li>
    </ul>

    <button class="intro-section__cta" id="intro-cta-btn" data-i18n="intro.cta">Create your calendar</button>
  </section>

  <!-- New project overlay -->
  <button class="new-project-overlay-trigger-btn hide">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-plus-icon lucide-calendar-plus">
      <path d="M16 19h6" />
      <path d="M16 2v4" />
      <path d="M19 16v6" />
      <path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5" />
      <path d="M3 10h18" />
      <path d="M8 2v4" />
    </svg>
  </button>

  <section class="new-project-section">
    <h1 data-i18n="newProject.title">New calendar</h1>
    <div class="new-project-section__close-modal">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-square-x-icon lucide-square-x">
        <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
        <path d="m15 9-6 6" />
        <path d="m9 9 6 6" />
      </svg>
    </div>

    <div class="new-project-section__mode-radio-btns">
      <div class="single">
        <input type="radio" id="single-page" name="calendar-mode" value="single-page" />
        <label for="single-page" data-i18n="newProject.singlePage">Single-page</label>
      </div>
      <div class="multi">
        <input type="radio" id="multi-page" name="calendar-mode" value="multi-page" checked />
        <label for="multi-page" data-i18n="newProject.multiPage">Multi-page</label><br />
      </div>
    </div>

    <div class="new-project-section__calendar-options">
      <div id="year-dropdown"></div>
      <div id="month-dropdown"></div>
      <div id="font-dropdown"></div>
      <div id="format-dropdown"></div>
    </div>

    <div class="new-project-section__get-button-container">
      <button id="get-button" data-i18n="newProject.create">Create</button>
    </div>
  </section>

  <div class="new-project-bg"></div>

  <!-- Calendar mockup -->
  <div class="calendar-container"></div>
  <div class="controls-container"></div>
  <div class="crop-controls-container"></div>
</body>

<script type="module" src="./src/lib/main.ts"></script>

</html>
